<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Net / Cyberspace — City</title>
<style>
  :root {
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; background: #050b16; overflow: hidden; font-family: 'Courier New', monospace; }
  #canvas-wrap { position: fixed; inset: 0; touch-action: none; }
  #hud {
    position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
    color: #4fd1ff; font-size: 12px; letter-spacing: 0.08em; line-height: 1.6;
    text-transform: uppercase; opacity: 0.85; pointer-events: none;
    text-shadow: 0 0 6px rgba(79, 209, 255, 0.6);
  }
  #hud .dim { color: #2a6a80; }
  #drift-toggle {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 16px;
    background: transparent;
    color: #4fd1ff;
    border: 1px solid #2a6a80;
    padding: 8px 14px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
  }
  #drift-toggle:hover { background: rgba(79, 209, 255, 0.08); }
</style>
</head>
<body>
<div id="canvas-wrap"></div>
<div id="hud">
  Net // City<br/>
  <span class="dim" id="stats">generating…</span><br/>
  <span class="dim">drag orbit · scroll/pinch zoom · WASD pan</span>
</div>
<button id="drift-toggle" type="button">Stop idle drift</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ==========================================================================
  // ARCHITECTURE OVERVIEW (read this before editing anything below)
  //
  // 1. Everything solid or line-based is collected into plain arrays first
  //    (buildingBoxes[] for buildings, edgeVerts/windowVerts/accentVerts/groundVerts/centerlineVerts[] for edge/window/accent/ground/
  //    centerline line segments) — nothing is added to the Three.js scene
  //    until generation is fully done.
  // 2. Roads are generated first: a rotated grid downtown, clipped by a
  //    wobbly ring road, then organic branching streets outside the ring.
  // 3. Buildings are placed per block (downtown/residential/hospital/park)
  //    and again along road frontage (houseCount + mid-rises), using addBox().
  // 4. Only at the end does everything get turned into actual GPU objects:
  //    ALL building solids become ONE THREE.InstancedMesh (one draw call
  //    for every building, regardless of count), and each line array
  //    becomes ONE THREE.LineSegments. Total scene draw calls stay
  //    roughly constant no matter how large the city grid is — this is
  //    what keeps it viable on lower-end hardware.
  // 5. Camera is a hand-rolled orbit/pan controller (drag, wheel/pinch,
  //    WASD) — no external controls addon, so no extra CDN dependency.
  // ==========================================================================

  var BG_COLOR = 0x050b16, EDGE_COLOR = 0x8fe9ff, WINDOW_COLOR = 0x2c7a94, ACCENT_COLOR = 0xd6faff, GROUND_COLOR = 0x1c4a5c;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(BG_COLOR);
  scene.fog = new THREE.Fog(BG_COLOR, 90, 520);

  var camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 1800);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.getElementById("canvas-wrap").appendChild(renderer.domElement);

  // ---------- seeded RNG (same city every load) ----------
  var rngState = 1337;
  function nextRandom() {
    rngState |= 0; rngState = (rngState + 0x6D2B79F5) | 0;
    var t = Math.imul(rngState ^ (rngState >>> 15), 1 | rngState);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randRange(a, b) { return a + nextRandom() * (b - a); }

  // ---------- local frames (so a block/site can be rotated as a unit) + spatial hash ----------
  var currentFrame = { x: 0, z: 0, r: 0, c: 1, s: 0 };
  function setFrame(x, z, r) { currentFrame.x = x; currentFrame.z = z; currentFrame.r = r; currentFrame.c = Math.cos(r); currentFrame.s = Math.sin(r); }
  function frameX(x, z) { return currentFrame.x + x * currentFrame.c + z * currentFrame.s; }
  function frameZ(x, z) { return currentFrame.z - x * currentFrame.s + z * currentFrame.c; }
  function createSpatialHash() {
    var cells = {}, CS = 12;
    return {
      put: function (x, z, id, i, r) { var k = Math.floor(x / CS) + "," + Math.floor(z / CS); (cells[k] || (cells[k] = [])).push({ x: x, z: z, id: id, i: i, r: r }); },
      near: function (x, z, maxd, skip) { // distance to nearest stored point (minus its radius)
        var best = 1e9, n = Math.ceil(maxd / CS), cx = Math.floor(x / CS), cz = Math.floor(z / CS);
        for (var a = -n; a <= n; a++) for (var b = -n; b <= n; b++) {
          var l = cells[(cx + a) + "," + (cz + b)]; if (!l) continue;
          for (var q = 0; q < l.length; q++) {
            var p = l[q]; if (skip && skip(p)) continue;
            var d = Math.hypot(p.x - x, p.z - z) - p.r; if (d < best) best = d;
          }
        }
        return best;
      }
    };
  }
  var buildingHash = createSpatialHash(); // building footprints
  function addFrameSegment(arr, ax, ay, az, bx, by, bz) { pushSegment(arr, frameX(ax, az), ay, frameZ(ax, az), frameX(bx, bz), by, frameZ(bx, bz)); }
  function addFrameLoop(arr, pts, y) { for (var i = 0; i < pts.length; i++) { var a = pts[i], b = pts[(i + 1) % pts.length]; addFrameSegment(arr, a[0], y, a[1], b[0], y, b[1]); } }

  // ---------- collectors: everything ends up in 5 draw calls ----------
  var buildingBoxes = [], edgeVerts = [], windowVerts = [], accentVerts = [], groundVerts = [], centerlineVerts = [];
  function pushSegment(arr, ax, ay, az, bx, by, bz) { arr.push(ax, ay, az, bx, by, bz); }
  function pushLoop(arr, pts, y) { // pts: [[x,z],...] closed polyline on the ground plane
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], q = pts[(i + 1) % pts.length];
      pushSegment(arr, p[0], y, p[1], q[0], y, q[1]);
    }
  }
  function rectCorners(cx, cz, w, d) {
    return [[cx - w / 2, cz - d / 2], [cx + w / 2, cz - d / 2], [cx + w / 2, cz + d / 2], [cx - w / 2, cz + d / 2]];
  }

  function addBox(x, y0, z, w, h, d, ry, win) {
    var X = frameX(x, z), Z = frameZ(x, z);
    var b = { x: X, cy: y0 + h / 2, z: Z, w: w, h: h, d: d, ry: (ry || 0) + currentFrame.r };
    b.c = Math.cos(b.ry); b.s = Math.sin(b.ry);
    buildingBoxes.push(b);
    if (win !== false) buildingHash.put(X, Z, 0, 0, Math.hypot(w, d) / 2);
    var i, k, bit, cs = [];
    for (i = 0; i < 8; i++) cs.push(localPoint(b, (i & 1 ? 1 : -1) * w / 2, (i & 2 ? 1 : -1) * h / 2, (i & 4 ? 1 : -1) * d / 2));
    for (i = 0; i < 8; i++) for (k = 0; k < 3; k++) {
      bit = 1 << k;
      if (!(i & bit)) pushSegment(edgeVerts, cs[i][0], cs[i][1], cs[i][2], cs[i | bit][0], cs[i | bit][1], cs[i | bit][2]);
    }
    if (win !== false && h > 3) addWindows(b);
    return b;
  }
  function localPoint(b, lastPointerX, lastPointerY, lz) {
    return [b.x + lastPointerX * b.c + lz * b.s, b.cy + lastPointerY, b.z - lastPointerX * b.s + lz * b.c];
  }
  function facePoint(b, f, u, y, n) {
    if (f === 0) return localPoint(b, u, y, n);
    if (f === 1) return localPoint(b, -u, y, -n);
    if (f === 2) return localPoint(b, n, y, -u);
    return localPoint(b, -n, y, u);
  }
  function addWindows(b) {
    var yb = -b.h / 2 + 1.2, yt = b.h / 2 - 0.6;
    var rows = Math.min(18, Math.floor((yt - yb) / 1.6));
    if (rows < 1) return;
    for (var f = 0; f < 4; f++) {
      var L = f < 2 ? b.w : b.d, n = (f < 2 ? b.d : b.w) / 2 + 0.03;
      var m = L * 0.12, cols = Math.max(1, Math.floor(L / 1.6)), i, p, q;
      for (i = 0; i <= cols; i++) {
        var u = -L / 2 + m + (L - 2 * m) * i / cols;
        p = facePoint(b, f, u, yb, n); q = facePoint(b, f, u, yt, n);
        pushSegment(windowVerts, p[0], p[1], p[2], q[0], q[1], q[2]);
      }
      for (i = 0; i <= rows; i++) {
        var y = yb + (yt - yb) * i / rows;
        p = facePoint(b, f, -L / 2 + m, y, n); q = facePoint(b, f, L / 2 - m, y, n);
        pushSegment(windowVerts, p[0], p[1], p[2], q[0], q[1], q[2]);
      }
    }
  }

  function addBillboard(x, y, z, ry) {
    var pw = randRange(3, 4.4), ph = pw * 0.44;
    addBox(x + Math.cos(ry) * pw * 0.35, y, z - Math.sin(ry) * pw * 0.35, 0.14, 1.3, 0.14, 0, false);
    addBox(x - Math.cos(ry) * pw * 0.35, y, z + Math.sin(ry) * pw * 0.35, 0.14, 1.3, 0.14, 0, false);
    addBox(x, y + 1.3, z, pw, ph, 0.16, ry, false);
  }

  // ---------- BuildingType config ----------
  var BLOCK_SIZE = 34;          // block footprint
  var STREET_WIDTH = 10;     // road width between blocks
  var BLOCK_PITCH = BLOCK_SIZE + STREET_WIDTH;  // block pitch
  var GRID_HALF_SPAN = 13;          // GRID_HALF_SPAN x GRID_HALF_SPAN blocks  (~570 x 570 units)

  var BUILDING_TYPES = {
    // lots of small/medium buildings; height scales with downtown density
    residential: {
      build: function (cx, cz, dens) { subdivide(cx, cz, dens, false); }
    },
    // fewer, taller, stepped towers with antennas
    downtown: {
      build: function (cx, cz, dens) { subdivide(cx, cz, dens, true); }
    },
    hospital: {
      build: function (cx, cz) {
        addBox(cx, 0, cz + 6, 26, 6, 12, 0);                 // low base
        addBox(cx - 5, 0, cz - 6, 14, 22, 12, 0);            // main wing
        addBox(cx + 8, 0, cz - 6, 8, 14, 10, 0);             // side wing
        // entrance canopy: slab on four posts
        addBox(cx, 3.2, cz + 14.5, 8, 0.3, 5, 0, false);
        [[-3.7, 12.2], [3.7, 12.2], [-3.7, 16.8], [3.7, 16.8]].forEach(function (p) {
          addBox(cx + p[0], 0, cz + p[1] + 0.0, 0.3, 3.2, 0.3, 0, false);
        });
        // roof cross on the main wing
        var a = 3.2, t = 1.1, ox = cx - 5, oz = cz - 6, y = 22.06;
        addFrameLoop(accentVerts, [[-t, -a], [t, -a], [t, -t], [a, -t], [a, t], [t, t], [t, a], [-t, a], [-t, t], [-a, t], [-a, -t], [-t, -t]]
          .map(function (p) { return [ox + p[0], oz + p[1]]; }), y);
        // helipad on the base roof: square, ring, H
        var hx = cx + 7, hz = cz + 6, hy = 6.06;
        addFrameLoop(accentVerts, rectCorners(hx, hz, 7, 7), hy);
        var ring = []; for (var i = 0; i < 20; i++) ring.push([hx + Math.cos(i / 20 * 6.2832) * 2.8, hz + Math.sin(i / 20 * 6.2832) * 2.8]);
        addFrameLoop(accentVerts, ring, hy);
        addFrameSegment(accentVerts, hx - 1, hy, hz - 1.3, hx - 1, hy, hz + 1.3);
        addFrameSegment(accentVerts, hx + 1, hy, hz - 1.3, hx + 1, hy, hz + 1.3);
        addFrameSegment(accentVerts, hx - 1, hy, hz, hx + 1, hy, hz);
        addFrameLoop(groundVerts, rectCorners(cx, cz, BLOCK_SIZE - 4, BLOCK_SIZE - 4), 0.02);         // placeLot fence
      }
    },
    park: {
      build: function (cx, cz) {
        addFrameLoop(groundVerts, rectCorners(cx, cz, 24, 20), 0.02);               // path ring
        [[0, 17], [0, -17]].forEach(function (p) { addFrameSegment(groundVerts, cx, 0.02, cz + p[1], cx, 0.02, cz + p[1] * 0.59); });
        [[17, 0], [-17, 0]].forEach(function (p) { addFrameSegment(groundVerts, cx + p[0], 0.02, cz, cx + p[0] * 0.71, 0.02, cz); });
        addFrameLoop(groundVerts, rectCorners(cx, cz, 13, 9), 0.02);                // pond + ripples
        addFrameLoop(groundVerts, rectCorners(cx, cz, 9, 5.5), 0.02);
        addFrameLoop(groundVerts, rectCorners(cx, cz, 5, 2.4), 0.02);
        for (var i = 0; i < 34; i++) {
          var x = randRange(-15.5, 15.5), z = randRange(-15.5, 15.5);
          if (Math.abs(x) < 8 && Math.abs(z) < 6) continue;   // keep pond clear
          if (Math.abs(x) < 1.2 || Math.abs(z) < 1.2) continue; // keep spokes clear
          var th = randRange(1.2, 2.2);
          addBox(cx + x, 0, cz + z, 0.35, th, 0.35, 0, false);
          var cw = randRange(1.5, 2.4);
          addBox(cx + x, th, cz + z, cw, cw * 1.15, cw, randRange(0, 1.57), false);
        }
      }
    }
  };

  function subdivide(cx, cz, dens, tall) {
    var nx = 2 + Math.floor(nextRandom() * 2.5), nz = 2 + Math.floor(nextRandom() * 2.5);
    if (tall) { nx = 1 + Math.floor(nextRandom() * 2.2); nz = 1 + Math.floor(nextRandom() * 2.2); }
    var lw = BLOCK_SIZE / nx, ld = BLOCK_SIZE / nz;
    for (var i = 0; i < nx; i++) for (var j = 0; j < nz; j++) {
      var w = (lw - 1.4) * randRange(0.72, 1), d = (ld - 1.4) * randRange(0.72, 1);
      var x = cx - BLOCK_SIZE / 2 + lw * (i + 0.5), z = cz - BLOCK_SIZE / 2 + ld * (j + 0.5);
      var h = randRange(5, 12) + dens * dens * randRange(8, tall ? 85 : 45);
      if (h > 20 && nextRandom() < 0.6) {                            // stepped tower
        var h1 = h * randRange(0.55, 0.7);
        addBox(x, 0, z, w, h1, d, 0);
        addBox(x, h1, z, w * 0.66, h - h1, d * 0.66, 0);
      } else {
        addBox(x, 0, z, w, h, d, 0);
      }
      if (h > 46) addBox(x, h, z, 0.3, randRange(6, 12), 0.3, 0, false); // antenna
      else if (h > 8 && nextRandom() < 0.22) addBillboard(x, h, z, Math.floor(nextRandom() * 4) * 1.5708 + randRange(-0.35, 0.35));
    }
  }

  // ---------- roadList: planned grid downtown, organic sprawl outside ----------
  var DOWNTOWN_ROTATION = 0.22, RING_RADIUS_BASE = 170, CITY_RADIUS = 330, MAX_ROADS = 420;
  function ringRadiusAt(a) { return RING_RADIUS_BASE + 8 * Math.sin(3 * a) + 5 * Math.sin(5 * a + 1); }
  var roadList = [], roadHash = createSpatialHash(), allRoadPoints = [], culDeSacs = [];

  function registerRoad(pts, w, tag) {
    var id = roadList.length, dense = [];
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
      for (var k = (i === 1 ? 0 : 1); k <= n; k++) {
        var x = a[0] + (b[0] - a[0]) * k / n, z = a[1] + (b[1] - a[1]) * k / n;
        dense.push([x, z]); roadHash.put(x, z, id, 0, 0); allRoadPoints.push([x, z]);
      }
    }
    roadList.push({ pts: pts, dense: dense, w: w, tag: tag });
    return id;
  }

  // reserve organic orgSites (1 hospital campus, 4 parks) before roadList growStreet, so roadList route around them
  var orgSites = [];
  ["hospital", "park", "park", "park", "park"].forEach(function (type) {
    for (var t = 0; t < 80; t++) {
      var a = randRange(0, 6.283), d = randRange(220, 300), x = Math.cos(a) * d, z = Math.sin(a) * d, ok = true;
      orgSites.forEach(function (s) { if (Math.hypot(s.x - x, s.z - z) < 80) ok = false; });
      if (!ok) continue;
      orgSites.push({ type: type, x: x, z: z, r: 24, rot: randRange(0, 6.283) });
      for (var k = 0; k < 12; k++) roadHash.put(x + Math.cos(k * 0.5236) * 12, z + Math.sin(k * 0.5236) * 12, -1, 0, 0);
      break;
    }
  });
  function isInSite(x, z) { return orgSites.some(function (s) { return Math.hypot(s.x - x, s.z - z) < s.r + 2; }); }

  // 1) planned downtown: slightly rotated orthogonal grid, clipped by a wobbly ring road
  setFrame(0, 0, DOWNTOWN_ROTATION);
  for (var gk = -4; gk <= 3; gk++) {
    var gc = (gk + 0.5) * BLOCK_PITCH;
    for (var go = 0; go < 2; go++) {
      var ends = [0, 0];
      [1, -1].forEach(function (sg, si) {
        for (var t = 0; t < 400; t += 2) {
          var lastPointerX = go ? gc : t * sg, lz = go ? t * sg : gc, wx = frameX(lastPointerX, lz), wz = frameZ(lastPointerX, lz);
          if (Math.hypot(wx, wz) > ringRadiusAt(Math.atan2(wz, wx))) { ends[si] = t * sg; break; }
        }
      });
      var u0 = ends[1], u1 = ends[0];
      var q0 = go ? [gc, u0] : [u0, gc], q1 = go ? [gc, u1] : [u1, gc];
      registerRoad([[frameX(q0[0], q0[1]), frameZ(q0[0], q0[1])], [frameX(q1[0], q1[1]), frameZ(q1[0], q1[1])]], 8, "grid");
    }
  }
  setFrame(0, 0, 0);
  var ring = [];
  for (var ri = 0; ri <= 96; ri++) { var ra = ri / 96 * 6.2832; ring.push([Math.cos(ra) * ringRadiusAt(ra), Math.sin(ra) * ringRadiusAt(ra)]); }
  var ringId = registerRoad(ring, 10, "ring");

  // 2) organic streets: wandering streamlines that branch and die near other roadList
  var growthQueue = [];
  for (var si = 0; si < 16; si++) {
    var sa = si / 16 * 6.283 + randRange(-0.2, 0.2);
    growthQueue.push({ x: Math.cos(sa) * ringRadiusAt(sa), z: Math.sin(sa) * ringRadiusAt(sa), h: sa, life: randRange(110, 190) | 0, parent: ringId });
  }
  function addCulDeSac(x, z, h) {
    var cx = x + Math.cos(h) * 7, cz = z + Math.sin(h) * 7, pts = [];
    for (var k = 0; k < 14; k++) {
      var px = cx + Math.cos(k / 14 * 6.283) * 7, pz = cz + Math.sin(k / 14 * 6.283) * 7;
      pts.push([px, pz]); if (k % 2 === 0) roadHash.put(px, pz, -2, 0, 0);
    }
    culDeSacs.push(pts);
  }
  function growStreet(s) {
    var pts = [[s.x, s.z]], id = roadList.length, turn = 0, cd = randRange(8, 20), hit = false;
    roadList.push({ pts: pts, dense: pts, w: 8, tag: "org" });
    for (var i = 0; i < s.life; i++) {
      turn = Math.max(-0.09, Math.min(0.09, turn * 0.92 + (nextRandom() - 0.5) * 0.05));
      s.h += turn;
      var nx = s.x + Math.cos(s.h) * 4, nz = s.z + Math.sin(s.h) * 4;
      if (Math.hypot(nx, nz) > CITY_RADIUS) break;
      var d = roadHash.near(nx, nz, 20, function (p) { return (p.id === id && i - p.i < 14) || (i < 10 && (p.id === s.parent || (s.parent === ringId && p.id <= ringId))); });
      if (d < 15) { hit = true; break; }
      s.x = nx; s.z = nz; pts.push([nx, nz]); roadHash.put(nx, nz, id, i, 0); allRoadPoints.push([nx, nz]);
      if (--cd < 0 && roadList.length < MAX_ROADS) {
        cd = randRange(7, 18);
        growthQueue.push({ x: nx, z: nz, h: s.h + (nextRandom() < 0.5 ? 1 : -1) * randRange(1.1, 1.9), life: randRange(45, 130) | 0, parent: id });
      }
    }
    if (!hit && pts.length > 4 && nextRandom() < 0.6) addCulDeSac(s.x, s.z, s.h);
  }
  for (var qi = 0; qi < growthQueue.length; qi++) growStreet(growthQueue[qi]);

  // 3) short access spur from the nearest road to every organic site
  orgSites.forEach(function (s) {
    var best = 1e9, bp = null;
    allRoadPoints.forEach(function (p) { var d = Math.hypot(p[0] - s.x, p[1] - s.z); if (d < best) { best = d; bp = p; } });
    var f = 14 / best;
    registerRoad([bp, [s.x + (bp[0] - s.x) * f, s.z + (bp[1] - s.z) * f]], 6, "spur");
  });

  // ---------- buildings ----------
  var typeCounts = { residential: 0, downtown: 0, hospital: 0, park: 0 }, houseCount = 0, midRiseCount = 0;

  // planned blocks on the rotated grid
  setFrame(0, 0, DOWNTOWN_ROTATION);
  for (var bi = -3; bi <= 3; bi++) for (var bj = -3; bj <= 3; bj++) {
    var bx = bi * BLOCK_PITCH, bz = bj * BLOCK_PITCH, dist = Math.hypot(bx, bz);
    if (dist > 135) continue;
    var dens = Math.max(0, 1 - dist / 150), type;
    if (bi === 2 && bj === 1) type = "hospital";
    else if ((bi === -1 && bj === -2) || (bi === 0 && bj === 3)) type = "park";
    else type = dens > 0.5 ? "downtown" : "residential";
    typeCounts[type]++;
    BUILDING_TYPES[type].build(bx, bz, dens);
  }
  // organic orgSites, each at its own random rotation
  orgSites.forEach(function (s) { setFrame(s.x, s.z, s.rot); typeCounts[s.type]++; BUILDING_TYPES[s.type].build(0, 0, 0); });
  setFrame(0, 0, 0);

  // frontage: mid-rise slabs near the core, houseCount facing the curving streets further out
  function placeLot(mx, mz, tx, tz, side, mid) {
    var w = mid ? randRange(9, 15) : randRange(5, 7.5), d = mid ? randRange(8, 12) : randRange(4.5, 6.5);
    var off = 7 + d / 2 + randRange(0, mid ? 2 : 1.5);
    var px = mx - tz * side * off, pz = mz + tx * side * off, r = Math.hypot(w, d) / 2;
    if (Math.hypot(px, pz) < 135 || Math.hypot(px, pz) > CITY_RADIUS + 10 || isInSite(px, pz)) return;
    if (roadHash.near(px, pz, 20) < r * 0.8 + 4.5) return;
    if (buildingHash.near(px, pz, 30) < r + 1.2) return;
    setFrame(px, pz, Math.atan2(-tz, tx));
    if (mid) {
      var h = randRange(9, 26);
      addBox(0, 0, 0, w, h, d, 0);
      if (h > 15 && nextRandom() < 0.5) addBox(0, h, 0, w * 0.6, randRange(3, 7), d * 0.6, 0);
      midRiseCount++;
    } else {
      var hh = randRange(2.8, 4);
      addBox(0, 0, 0, w, hh, d, 0);
      addBox(0, hh, 0, w * 0.98, 1.3, d * 0.55, 0, false); // roof
      houseCount++;
    }
    setFrame(0, 0, 0);
  }
  roadList.forEach(function (rd) {
    if (rd.tag === "spur") return;
    var acc = 0, gap = 0, pts = rd.dense;
    for (var i = 1; i < pts.length; i++) {
      var a = pts[i - 1], b = pts[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (!L) continue;
      acc += L; if (acc < gap) continue;
      acc = 0;
      var mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2, mid = Math.hypot(mx, mz) < 235;
      gap = mid ? randRange(15, 20) : randRange(9, 13);
      var tx = (b[0] - a[0]) / L, tz = (b[1] - a[1]) / L;
      placeLot(mx, mz, tx, tz, 1, mid); placeLot(mx, mz, tx, tz, -1, mid);
    }
  });

  // ---------- draw roadList: two kerb makeLineBatch + dashed centre-line ----------
  roadList.forEach(function (rd) {
    var p = rd.pts, n = p.length, hw = rd.w / 2, Lp = [], Rp = [], i;
    for (i = 0; i < n; i++) {
      var a = p[Math.max(0, i - 1)], b = p[Math.min(n - 1, i + 1)];
      var dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz) || 1, nx = -dz / l * hw, nz = dx / l * hw;
      Lp.push([p[i][0] + nx, p[i][1] + nz]); Rp.push([p[i][0] - nx, p[i][1] - nz]);
    }
    for (i = 1; i < n; i++) {
      pushSegment(groundVerts, Lp[i - 1][0], 0.02, Lp[i - 1][1], Lp[i][0], 0.02, Lp[i][1]);
      pushSegment(groundVerts, Rp[i - 1][0], 0.02, Rp[i - 1][1], Rp[i][0], 0.02, Rp[i][1]);
    }
    for (i = 1; i < rd.dense.length; i += 2) {
      var c0 = rd.dense[i - 1], c1 = rd.dense[i];
      pushSegment(centerlineVerts, c0[0], 0.02, c0[1], c1[0], 0.02, c1[1]);
    }
  });
  culDeSacs.forEach(function (pts) { pushLoop(groundVerts, pts, 0.02); });
  var STATS = roadList.length + " roadList · " + buildingBoxes.length + " solids · " + houseCount + " houseCount · " + midRiseCount + " mid-rises · "
    + typeCounts.hospital + " hospitals · " + typeCounts.park + " parks";

  // ---------- build GPU objects: 1 buildingMesh solid + 4 line batches ----------
  var buildingMesh = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshBasicMaterial({ color: 0x000000, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 }),
    buildingBoxes.length
  );
  var tempObj = new THREE.Object3D();
  buildingBoxes.forEach(function (b, i) {
    tempObj.position.set(b.x, b.cy, b.z);
    tempObj.rotation.set(0, b.ry, 0);
    tempObj.scale.set(b.w, b.h, b.d);
    tempObj.updateMatrix();
    buildingMesh.setMatrixAt(i, tempObj.matrix);
  });
  buildingMesh.instanceMatrix.needsUpdate = true;
  buildingMesh.frustumCulled = false; // instances live all over the map; the unit-box bounds would cull wrongly
  scene.add(buildingMesh);

  // ---------- merge all 5 line layers into ONE draw call ----------
  //
  // Each layer (edges/windows/accents/ground/centerline) previously got
  // its own LineSegments + material, so its "opacity" was blended with
  // whatever was behind it every frame by the GPU. But everything here
  // only ever sits in front of one thing: the flat fog/background color
  // (lines almost never visually overlap each other in this scene).
  //
  // Standard alpha compositing is: result = alpha*foreground + (1-alpha)*background,
  // applied per RGB channel. Since "background" is a known constant here,
  // we can compute that blend ONCE per vertex, up front, and bake it
  // straight into the vertex color. The result is an opaque color that
  // looks identical to the translucent version against this background,
  // but costs the GPU one draw call instead of five — the blending math
  // moves from "every frame, every pixel" to "once, at page load."
  function blendedColor(hex, alpha) {
    var c = new THREE.Color(hex);
    var bg = new THREE.Color(BG_COLOR);
    return [
      c.r * alpha + bg.r * (1 - alpha),
      c.g * alpha + bg.g * (1 - alpha),
      c.b * alpha + bg.b * (1 - alpha),
    ];
  }

  function appendLayer(positions, colors, verts, hex, alpha) {
    var rgb = blendedColor(hex, alpha);
    for (var i = 0; i < verts.length; i += 3) {
      positions.push(verts[i], verts[i + 1], verts[i + 2]);
      colors.push(rgb[0], rgb[1], rgb[2]);
    }
  }

  var mergedPositions = [];
  var mergedColors = [];
  appendLayer(mergedPositions, mergedColors, edgeVerts, EDGE_COLOR, 0.9);
  appendLayer(mergedPositions, mergedColors, windowVerts, WINDOW_COLOR, 0.7);
  appendLayer(mergedPositions, mergedColors, accentVerts, ACCENT_COLOR, 1);
  appendLayer(mergedPositions, mergedColors, groundVerts, GROUND_COLOR, 0.8);
  appendLayer(mergedPositions, mergedColors, centerlineVerts, GROUND_COLOR, 0.45);

  var mergedGeom = new THREE.BufferGeometry();
  mergedGeom.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(mergedPositions, 3)
  );
  mergedGeom.setAttribute(
    "color",
    new THREE.Float32BufferAttribute(mergedColors, 3)
  );
  var mergedMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    fog: true,
  });
  scene.add(new THREE.LineSegments(mergedGeom, mergedMat));
  // Total scene draw calls: 1 instanced mesh (all buildings) + 1 merged
  // line batch (all edges/windows/accents/roads) = 2, regardless of
  // city size.

  // ---------- orbit camera (drag, wheel, pinch, WASD) ----------
  var camTarget = new THREE.Vector3(0, 10, 0);
  var camRadius = 330, camAzimuth = 0.6, camPolar = 1.05;
  var isDragging = false, lastPointerX = 0, lastPointerY = 0, pinchDist = 0, lastInputTime = 0;
  function updateCamera() {
    camPolar = Math.max(0.12, Math.min(Math.PI / 2 - 0.02, camPolar));
    camRadius = Math.max(8, Math.min(900, camRadius));
    camera.position.set(
      camTarget.x + camRadius * Math.sin(camPolar) * Math.sin(camAzimuth),
      camTarget.y + camRadius * Math.cos(camPolar),
      camTarget.z + camRadius * Math.sin(camPolar) * Math.cos(camAzimuth));
    camera.lookAt(camTarget);
  }
  updateCamera();
  function onDragStart(x, y) { isDragging = true; lastPointerX = x; lastPointerY = y; lastInputTime = performance.now(); }
  function onDragMove(x, y) {
    if (!isDragging) return;
    camAzimuth -= (x - lastPointerX) * 0.006; camPolar -= (y - lastPointerY) * 0.006; lastPointerX = x; lastPointerY = y;
    lastInputTime = performance.now(); updateCamera();
  }
  var el = renderer.domElement;
  el.addEventListener("mousedown", function (e) { onDragStart(e.clientX, e.clientY); });
  addEventListener("mousemove", function (e) { onDragMove(e.clientX, e.clientY); });
  addEventListener("mouseup", function () { isDragging = false; });
  el.addEventListener("wheel", function (e) { e.preventDefault(); camRadius *= 1 + e.deltaY * 0.0012; lastInputTime = performance.now(); updateCamera(); }, { passive: false });
  function touchDist(e) { var a = e.touches[0], b = e.touches[1]; return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }
  el.addEventListener("touchstart", function (e) {
    if (e.touches.length === 2) { isDragging = false; pinchDist = touchDist(e); } else onDragStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  el.addEventListener("touchmove", function (e) {
    if (e.touches.length === 2) { var d = touchDist(e); camRadius *= pinchDist / d; pinchDist = d; lastInputTime = performance.now(); updateCamera(); }
    else onDragMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  addEventListener("touchend", function () { isDragging = false; });

  var keysDown = {};
  addEventListener("keydown", function (e) { keysDown[e.key.toLowerCase()] = true; });
  addEventListener("keyup", function (e) { keysDown[e.key.toLowerCase()] = false; });
  function applyPan() {
    var f = (keysDown.w || keysDown.arrowup ? 1 : 0) - (keysDown.s || keysDown.arrowdown ? 1 : 0);
    var r = (keysDown.d || keysDown.arrowright ? 1 : 0) - (keysDown.a || keysDown.arrowleft ? 1 : 0);
    if (!f && !r) return;
    var sp = camRadius * 0.008;
    // camera sits at +sin(az), +cos(az) from camTarget, so "forward" points the opposite way
    camTarget.x += (-Math.sin(camAzimuth) * f + Math.cos(camAzimuth) * r) * sp;
    camTarget.z += (-Math.cos(camAzimuth) * f - Math.sin(camAzimuth) * r) * sp;
    var lim = 330;
    camTarget.x = Math.max(-lim, Math.min(lim, camTarget.x));
    camTarget.z = Math.max(-lim, Math.min(lim, camTarget.z));
    lastInputTime = performance.now(); updateCamera();
  }

  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById("stats").textContent = STATS;

  var driftEnabled = true;
  var driftBtn = document.getElementById("drift-toggle");
  driftBtn.addEventListener("click", function () {
    driftEnabled = !driftEnabled;
    driftBtn.textContent = driftEnabled ? "Stop idle drift" : "Resume idle drift";
  });

  function animate() {
    requestAnimationFrame(animate);
    applyPan();
    // idle drift: slow auto-orbit after 4s of no input, unless turned off
    if (driftEnabled && performance.now() - lastInputTime > 4000) { camAzimuth += 0.0008; updateCamera(); }
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
