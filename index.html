<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Net / Cyberspace — City</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="canvas-wrap"></div>
<div id="ui-layer">
  <div id="hud">
    Net // City<br/>
    <span class="dim" id="stats">generating…</span><br/>
    <span class="dim">drag orbit · scroll/pinch zoom · WASD pan · Tab hides this UI</span>
  </div>

  <div id="settings-panel">
    <div class="row">
      <label>Drift speed <span id="drift-speed-slider-val">0.0015</span></label>
      <input type="range" id="drift-speed-slider" min="0.0002" max="0.006" step="0.0001" value="0.0015" />
    </div>
    <div class="row">
      <label>Pan speed <span id="pan-speed-slider-val">1</span></label>
      <input type="range" id="pan-speed-slider" min="0.3" max="2.5" step="0.1" value="1" />
    </div>
    <div class="row">
      <label>Streak brightness <span id="streak-brightness-slider-val">100%</span></label>
      <input type="range" id="streak-brightness-slider" data-fmt="pct" min="0.2" max="1" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>Fog amount <span id="fog-slider-val">100%</span></label>
      <input type="range" id="fog-slider" data-fmt="pct" min="0" max="1" step="0.05" value="1" />
    </div>
  </div>

  <div id="btn-row">
    <button id="drift-toggle" class="ctl-btn" type="button">Start drift</button>
    <button id="view-toggle" class="ctl-btn" type="button">Dot view</button>
    <button id="glitch-toggle" class="ctl-btn" type="button">Hide glitch cubes</button>
    <button id="settings-toggle" class="ctl-btn" type="button">⚙ Settings</button>
  </div>
</div>

<!-- Import map so every module can just `import * as THREE from "three"`
     instead of hardcoding a CDN URL in every single file. Bump the
     version here in one place if you ever want to upgrade Three.js. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
