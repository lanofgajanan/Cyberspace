<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Net / Cyberspace — City</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="canvas-wrap"></div>
<div id="ui-layer">
  <div id="hud">
    Net // <span id="mode-status">legacy city</span><br/>
    <span class="dim" id="stats">generating…</span><br/>
    <span class="dim" id="diagnostics">status: starting</span><br/>
    <span class="dim">drag orbit · scroll/pinch zoom · WASD pan</span><br/>
    <span class="dim">Fly mode: click canvas to lock mouse · look to turn · WASD+Space/Shift move · Esc unlocks · Tab hides this UI</span>
  </div>
  <div id="loading" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-title">INITIALIZING CITY SIMULATION…</div>
      <div class="progress-track" role="progressbar" aria-label="City generation progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="loading-progress"></div>
      </div>
      <div id="loading-status">Preparing renderer</div>
      <div id="loading-error" role="alert" hidden></div>
      <button id="loading-retry" class="ctl-btn" type="button" hidden>Retry generation</button>
    </div>
  </div>
  <div id="mode-panel">
    <label for="mode-select">World profile</label>
    <select id="mode-select">
      <option value="megacity">Megacity vertical slice</option>
      <option value="legacy">Legacy city</option>
    </select>
  </div>

  <div id="settings-panel">
    <div class="row">
      <label>Drift speed <span id="drift-speed-slider-val">0.0015</span></label>
      <input type="range" id="drift-speed-slider" min="0.0002" max="0.006" step="0.0001" value="0.0015" />
    </div>
    <div class="row">
      <label>Pan speed <span id="pan-speed-slider-val">1</span></label>
      <input type="range" id="pan-speed-slider" min="0.3" max="2.5" step="0.1" value="1" />
    </div>
    <div class="row">
      <label>Streak brightness <span id="streak-brightness-slider-val">100%</span></label>
      <input type="range" id="streak-brightness-slider" data-fmt="pct" min="0.2" max="1" step="0.05" value="1" />
    </div>
    <div class="row">
      <label>Fog amount <span id="fog-slider-val">100%</span></label>
      <input type="range" id="fog-slider" data-fmt="pct" min="0" max="1" step="0.05" value="1" />
    </div>
  </div>

  <div id="btn-row">
    <button id="drift-toggle" class="ctl-btn" type="button">Start drift</button>
    <button id="view-toggle" class="ctl-btn" type="button">Dot view</button>
    <button id="glitch-toggle" class="ctl-btn" type="button">Hide glitch cubes</button>
    <button id="settings-toggle" class="ctl-btn" type="button">⚙ Settings</button>
    <button id="fly-toggle" class="ctl-btn" type="button">Fly mode</button>
    <button id="replay-capture" class="ctl-btn" type="button">Capture waypoint</button>
    <button id="replay-play" class="ctl-btn" type="button">Play replay</button>
    <button id="replay-export" class="ctl-btn" type="button">Export replay</button>
    <button id="replay-import" class="ctl-btn" type="button">Import replay</button>
    <input id="replay-file" type="file" accept="application/json" hidden />
  </div>
</div>

<!-- Import map so every module can just `import * as THREE from "three"`
     instead of hardcoding a CDN URL in every single file. Bump the
     version here in one place if you ever want to upgrade Three.js. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js"
  }
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
